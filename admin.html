<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    
    <!-- Admin Security Headers -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Hexocode Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #050505;
      }
      body {
        margin: 0;
        background-color: var(--bg-color);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-color);
        transition: opacity 0.4s ease-out;
      }
      .loader {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(183, 163, 90, 0.2);
        border-top-color: #b7a35a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="loader"></div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/client/admin.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const splash = document.getElementById('splash')
        if (splash) {
          splash.style.opacity = '0'
          setTimeout(() => splash.remove(), 400)
        }
      })
    </script>
  </body>
</html>
