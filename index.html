<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hexocode — a two-developer software studio building websites, web apps, mobile apps and custom business systems for real businesses." />
    <meta name="theme-color" content="#0A2017" />
    <meta property="og:site_name" content="Hexocode" />
    <meta property="og:title" content="Hexocode — Digital Products Built for Real Businesses" />
    <meta property="og:description" content="We design and build websites, web applications, mobile apps and custom software for startups, stores and growing companies." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <link rel="apple-touch-icon" href="/static/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Restore theme preference before paint to avoid flash
      try {
        var t = localStorage.getItem('hexo-theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
        else if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <title>Hexocode</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
